[package]
name = "salescopilot-sync-hub"
version = "0.1.0"
edition = "2021"
description = "Hub side of the Sales Copilot local-network sync protocol (spec/sync-protocol.md, v1)"
license = "MIT"
publish = false

# Built on its own until the desktop app depends on it; the root workspace excludes this directory.
[workspace]

[lib]
name = "sync_hub"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fs4 = "0.13"
futures-util = "0.3"
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
hex = "0.4"
if-addrs = "0.13"
jsonschema = { version = "0.30", default-features = false }
mdns-sd = "0.13"
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1.40", features = ["full"] }
socket2 = "0.5"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["decompression-gzip", "timeout"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.16"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots-no-provider", "json", "gzip"] }
flate2 = "1"
tempfile = "3"
